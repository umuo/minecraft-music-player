plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = rootProject.group
version = rootProject.version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = rootProject.neo_version
    parchment {
        mappingsVersion = rootProject.parchment_mappings_version
        minecraftVersion = rootProject.parchment_minecraft_version
    }
}

dependencies {
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

tasks.register('catalogSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Calls the live Kugou and NetEase catalog endpoints and validates normalized results.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gitsilence.musicbox.ui.catalog.CatalogIntegrationProbe'
    dependsOn testClasses
}

tasks.register('coverUnitTest', JavaExec) {
    group = 'verification'
    description = 'Validates cover URL security policy.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gitsilence.musicbox.ui.cover.CoverTextureCacheTest'
    dependsOn testClasses
}

tasks.register('additionalProvidersUnitTest', JavaExec) {
    group = 'verification'
    description = 'Validates QQ, Kuwo, and Migu catalog mappings and source ids.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gitsilence.musicbox.ui.catalog.provider.AdditionalProvidersTest'
    dependsOn testClasses
}

tasks.register('playlistImportProviderUnitTest', JavaExec) {
    group = 'verification'
    description = 'Validates playlist URL allowlists and five platform fixture parsers without live APIs.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gitsilence.musicbox.ui.catalog.provider.PlaylistImportProviderTest'
    dependsOn testClasses
}

tasks.named('check').configure {
    dependsOn coverUnitTest, additionalProvidersUnitTest, playlistImportProviderUnitTest
}
